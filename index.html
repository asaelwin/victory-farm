<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Victory Chicken Farm</title>
<meta name="description" content="Pembukuan peternakan ayam: DOC, panen, pengeluaran, gaji & kasbon ABK, laporan keuangan.">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1217" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Victory Farm">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>/* Layout: one-hand ledger. One content column (max 640px), tab bar in the thumb zone,
   forms open as bottom sheets with a sticky save bar, reports drawn as ruled ledger rows
   with the red margin line of an Indonesian buku kas. System UI type for native feel and
   tabular figures; no web fonts so the app works offline. */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --surface-2: #EBEFF4; --line: #D6DCE4; --line-2: #E6EAF0;
  --ink: #142030; --ink-2: #536072; --ink-3: #7A8596;
  --accent: #1F4E8C; --accent-ink: #FFFFFF; --accent-soft: #E2EBF7;
  --margin: #C8453B;
  --good: #11744E; --good-soft: #E1F2EA; --warn: #9A5806; --warn-soft: #FBEFD9; --bad: #B42318; --bad-soft: #FBE5E2;
  --chart-in: #2F6DB5; --chart-out: #D2762A; --chart-profit: #178A63; --chart-grid: #E3E8EE;
  --shadow: 0 1px 2px rgba(20, 32, 48, .06), 0 4px 16px rgba(20, 32, 48, .06);
  --scrim: rgba(12, 18, 28, .45);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  --brand-gold: #D9771A;
  --r: 14px; --r-sm: 10px; --tap: 48px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1217; --surface: #171C22; --surface-2: #1F252D; --line: #2D343E; --line-2: #242A33;
  --ink: #E6EBF1; --ink-2: #A3AEBC; --ink-3: #7F8A99;
  --accent: #8FB4EA; --accent-ink: #0E1217; --accent-soft: #1D2A3C;
  --margin: #E0766C;
  --good: #4CC08A; --good-soft: #15302A; --warn: #E8A64A; --warn-soft: #33270F; --bad: #F07A6E; --bad-soft: #3A1C1A;
  --chart-in: #5B93D6; --chart-out: #D3782C; --chart-profit: #3BA77A; --chart-grid: #262D36;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --scrim: rgba(0, 0, 0, .6); --brand-gold: #FFC24A; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --brand-gold: #FFC24A;
  --bg: #0E1217; --surface: #171C22; --surface-2: #1F252D; --line: #2D343E; --line-2: #242A33;
  --ink: #E6EBF1; --ink-2: #A3AEBC; --ink-3: #7F8A99;
  --accent: #8FB4EA; --accent-ink: #0E1217; --accent-soft: #1D2A3C;
  --margin: #E0766C;
  --good: #4CC08A; --good-soft: #15302A; --warn: #E8A64A; --warn-soft: #33270F; --bad: #F07A6E; --bad-soft: #3A1C1A;
  --chart-in: #5B93D6; --chart-out: #D3782C; --chart-profit: #3BA77A; --chart-grid: #262D36;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.banner > svg, .recon > svg { width: 22px; height: 22px; flex: none; margin-top: 1px; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .amt, td.n, .kpi b { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- shell */
#app { min-height: 100%; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line-2); }
.topbar-in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 16px; min-height: 56px; }
.topbar h1 { font-size: 21px; font-weight: 700; flex: 1; min-width: 0; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .usaha { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); letter-spacing: .02em; }
.brandmark { width: 34px; height: 34px; flex: none; }
.brandmark svg, .brand-hero svg { display: block; width: 100%; height: 100%; }
.brand-hero { display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--ink); }
.brand-hero > svg:first-child { width: 88px; height: 88px; filter: drop-shadow(0 6px 14px rgba(17, 46, 87, .25)); }
.brand-hero > svg:last-child { width: min(240px, 70%); height: auto; }
.small-hero > svg:first-child { width: 56px; height: 56px; }
.small-hero > svg:last-child { width: 150px; }
.iconbtn { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); flex: none; }
.iconbtn:active { background: var(--surface-2); }
.iconbtn svg { width: 24px; height: 24px; }
main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); }
.tab { border: 0; background: none; padding: 7px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-3); cursor: pointer; min-height: 56px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.banner { border-radius: var(--r-sm); padding: 10px 12px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.banner b { display: block; }
.banner.demo { background: var(--warn-soft); color: var(--warn); border: 1px solid currentColor; }
.banner.info { background: var(--accent-soft); color: var(--ink); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner .btn { margin-left: auto; flex: none; }

/* ---- type helpers */
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 4px; }
.section-h h2 { font-size: 17px; }

/* ---- surfaces */
.card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card h3 { font-size: 16px; margin-bottom: 8px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 359px) { .grid2 { grid-template-columns: 1fr; } }

/* ---- KPI tiles */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; cursor: pointer; }
.kpi span { font-size: 13px; color: var(--ink-2); line-height: 1.25; }
.kpi b { font-size: clamp(15px, 4.4vw, 18px); font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; }
.kpi small { font-size: 12px; color: var(--ink-3); }
.kpi.wide { grid-column: 1 / -1; }
.kpi.hero { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.kpi.hero span, .kpi.hero small { color: inherit; opacity: .85; }
.kpi.hero b { font-size: clamp(22px, 7vw, 26px); }
.kpi .msg { font-size: 13px; font-weight: 500; line-height: 1.35; white-space: normal; }

/* ---- quick add */
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.qbtn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); min-height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--ink); padding: 6px 4px; text-align: center; line-height: 1.2; }
.qbtn svg { width: 24px; height: 24px; color: var(--accent); }
.qbtn:active { background: var(--surface-2); }

/* ---- chips & period */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 0 14px; min-height: 38px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.periode-label { font-size: 13px; color: var(--ink-2); }

/* ---- lists */
.list { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; cursor: pointer; color: var(--ink); min-height: var(--tap); }
.item:last-child { border-bottom: 0; }
.item:active { background: var(--surface-2); }
.item .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .a { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.item .s { font-size: 13px; color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .r { font-size: 12px; text-align: right; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.summary-line { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink-2); }
.summary-line b { color: var(--ink); font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.badge.ok { background: var(--good-soft); color: var(--good); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.info { background: var(--accent-soft); color: var(--accent); }
.badge.mute { background: var(--surface-2); color: var(--ink-2); }

/* ---- buttons */
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; min-height: 44px; padding: 0 16px; font-weight: 650; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: var(--surface); }
.btn.danger.solid { background: var(--bad); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding: 0 8px; }
.btn.block { width: 100%; }
.btn.big { min-height: 54px; font-size: 17px; border-radius: 14px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.fab { position: fixed; right: max(16px, calc(50% - 304px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 25; width: 60px; height: 60px; border-radius: 20px; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px rgba(20, 40, 80, .28); display: grid; place-items: center; cursor: pointer; }
.fab svg { width: 30px; height: 30px; }

/* ---- forms */
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld > span, .fld > .lbl { font-size: 14px; font-weight: 650; color: var(--ink-2); }
.fld .hint { font-size: 12.5px; color: var(--ink-3); font-weight: 400; }
.inp, .fld select, .fld textarea { width: 100%; min-height: var(--tap); border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 17px; }
.fld textarea { min-height: 80px; resize: vertical; }
.inp:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.inp.err { border-color: var(--bad); }
.prefix { position: relative; }
.prefix > i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--ink-2); font-weight: 600; pointer-events: none; }
.prefix > .inp { padding-left: 42px; font-weight: 650; font-variant-numeric: tabular-nums; }
.suffix { position: relative; }
.suffix > i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--ink-2); pointer-events: none; }
.suffix > .inp { padding-right: 48px; font-variant-numeric: tabular-nums; }
.datebox { position: relative; min-height: var(--tap); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); display: flex; align-items: center; padding: 0 12px; gap: 8px; font-size: 17px; font-variant-numeric: tabular-nums; cursor: pointer; }
.datebox svg { width: 20px; height: 20px; color: var(--ink-2); margin-left: auto; }
.datebox input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; cursor: pointer; }
.datebox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.datebox .kosong { color: var(--ink-3); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { flex: 1 1 auto; position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 600; font-size: 15px; cursor: pointer; text-align: center; line-height: 1.2; }
.seg input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.seg.cats { display: grid; grid-template-columns: 1fr 1fr; }
.seg.cats span { justify-content: flex-start; text-align: left; min-height: 48px; }
.calc { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.calc span { font-size: 14px; color: var(--ink-2); }
.calc b { font-size: 22px; font-variant-numeric: tabular-nums; }
.calc.small b { font-size: 17px; }
.itembox { border: 1px dashed var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.itembox header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; }
details.more { border-top: 1px solid var(--line-2); padding-top: 10px; }
details.more summary { cursor: pointer; font-weight: 650; color: var(--accent); min-height: 40px; display: flex; align-items: center; }
.errors { background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.errors ul { margin: 4px 0 0; padding-left: 18px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; cursor: pointer; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs canvas { width: 84px; height: 84px; border-radius: 10px; border: 1px solid var(--line); object-fit: cover; background: var(--surface-2); cursor: pointer; }

/* ---- sheets & dialogs */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden; animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 16px; border-bottom: 1px solid var(--line-2); background: var(--surface); }
.sheet-h h2 { font-size: 18px; flex: 1; min-width: 0; }
.sheet-h .dirty { font-size: 12px; color: var(--warn); font-weight: 700; display: none; white-space: nowrap; }
.sheet.is-dirty .sheet-h .dirty { display: inline; }
.sheet-b { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch; }
.sheet-f { padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line-2); background: var(--surface); display: flex; gap: 10px; }
.sheet-f .btn { flex: 1; }
.dialog { background: var(--surface); border-radius: 18px; padding: 20px; width: min(420px, calc(100% - 32px)); margin: auto; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.scrim.center { align-items: center; }
.dialog h2 { font-size: 18px; }
.dialog .acts { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 80; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 15px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

/* ---- detail */
dl.kv { display: grid; grid-template-columns: minmax(110px, 40%) 1fr; gap: 0; margin: 0; }
dl.kv dt, dl.kv dd { padding: 9px 0; border-bottom: 1px solid var(--line-2); margin: 0; font-size: 15px; }
dl.kv dt { color: var(--ink-2); }
dl.kv dd { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }

/* ---- ledger report */
.ledger { width: 100%; border-collapse: collapse; font-size: 15px; }
.ledger td { padding: 9px 0; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.ledger td:first-child { padding-left: 12px; border-left: 2px solid var(--margin); }
.ledger td.n { text-align: right; padding-left: 10px; white-space: nowrap; font-weight: 600; }
.ledger tr.sub td:first-child { padding-left: 24px; color: var(--ink-2); }
.ledger tr.tot td { font-weight: 800; border-top: 1.5px solid var(--ink); border-bottom-color: var(--ink-2); }
.ledger tr.head td { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); padding-top: 14px; }
.ledger tr[data-act] { cursor: pointer; }
.ledger tr[data-act] td:first-child::after { content: " ›"; color: var(--ink-3); }
.ledger tr[data-act]:active td { background: var(--surface-2); }
.ledger .neg { color: var(--bad); }
.scrollx { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.mtable { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.mtable th, .mtable td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mtable th:first-child, .mtable td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
.mtable th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); }
.mtable tr.tot td { font-weight: 800; border-top: 1.5px solid var(--ink); }
.segtabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.segtabs button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 650; font-size: 14px; cursor: pointer; min-height: 40px; }
.segtabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.recon { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; }
.taxbox { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.taxbox ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

/* ---- charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--ink-2); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--chart-grid); stroke-width: 1; }
.chart .zero { stroke: var(--ink-3); stroke-width: 1; }
.chart .in { fill: var(--chart-in); }
.chart .out { fill: var(--chart-out); }
.chart .pl { stroke: var(--chart-profit); stroke-width: 2; fill: none; }
.chart .pd { fill: var(--chart-profit); stroke: var(--surface); stroke-width: 2; }
.chart .area { fill: var(--chart-profit); opacity: .12; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit:hover, .chart .hit.on { fill: var(--ink); opacity: .05; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.tip { font-size: 13px; min-height: 20px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tip b { color: var(--ink); }

/* ---- lock */
.lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; }
.lock .inp { text-align: center; font-size: 28px; letter-spacing: .4em; max-width: 220px; }
</style>
</head>
<body>
<div id="app"></div>
<script>/* Victory Chicken Farm — core engine (pure functions, no DOM).
 * Money: integer Rupiah. Weight: integer grams. Dates: ISO 'YYYY-MM-DD' strings.
 * Source documents are the only stored truth; the double-entry journal is derived
 * from them on demand, so every report is generated from saved transactions. */
(function (root) {
'use strict';
const C = {};
C.VERSI = '1.0.0';

/* ---------------------------------------------------------------- money */
C.mulDiv = function (a, b, c) { // round-half-away-from-zero(a*b/c), exact via BigInt
  const p = BigInt(a) * BigInt(b), d = BigInt(c);
  if (d === 0n) throw new Error('bagi nol');
  const neg = (p < 0n) !== (d < 0n);
  const ap = p < 0n ? -p : p, ad = d < 0n ? -d : d;
  const q = (ap * 2n + ad) / (2n * ad);
  return Number(neg ? -q : q);
};
C.sum = arr => arr.reduce((s, x) => s + x, 0);
C.grp = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
C.fmtRp = function (n, opt) {
  n = Math.round(n || 0);
  const s = 'Rp ' + C.grp(Math.abs(n));
  if (n < 0) return (opt && opt.kurung) ? '(' + s + ')' : '−' + s;
  return s;
};
C.fmtAngka = n => (n < 0 ? '−' : '') + C.grp(Math.abs(Math.round(n || 0)));
/* Parse a Rupiah amount typed in Indonesian style. Returns integer or null. */
C.parseRupiah = function (str, bolehNegatif) {
  if (typeof str === 'number') return Number.isSafeInteger(str) ? str : null;
  let s = String(str == null ? '' : str).trim().replace(/^rp\.?/i, '').replace(/\s/g, '');
  if (!s) return null;
  let neg = false;
  if (/^[-−]/.test(s)) { neg = true; s = s.slice(1).replace(/^rp\.?/i, ''); }
  if (/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(s) || /^\d+(,\d{1,2})?$/.test(s)) {
    const [i, f] = s.replace(/\./g, '').split(',');
    let v = Number(i); if (f) v += Math.round(Number('0.' + f));
    if (!Number.isSafeInteger(v)) return null;
    if (neg && !bolehNegatif) return null;
    return neg ? -v : v;
  }
  if (/^\d{1,3}(,\d{3})+$/.test(s)) { // 1,234,567 (English grouping)
    const v = Number(s.replace(/,/g, ''));
    if (neg && !bolehNegatif) return null;
    return neg ? -v : v;
  }
  return null;
};
/* Weight in kg → integer grams. "1.850" = 1850 kg, "1.850,5" = 1850.5 kg, "18,25" = 18.25 kg. */
C.parseKg = function (str) {
  if (typeof str === 'number') return Math.round(str * 1000);
  let s = String(str == null ? '' : str).trim().replace(/kg$/i, '').replace(/\s/g, '');
  if (!s) return null;
  if (s.includes(',')) {
    if (!/^\d{1,3}(\.\d{3})*,\d+$|^\d+,\d+$/.test(s)) return null;
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  if (!/^\d+(\.\d+)?$/.test(s)) return null;
  const [i, f = ''] = s.split('.');
  let g = Number(i) * 1000 + Number((f + '000').slice(0, 3));
  if (f.length > 3 && Number(f[3]) >= 5) g += 1;
  return Number.isSafeInteger(g) ? g : null;
};
C.fmtKg = function (g, satuan) {
  g = Math.round(g || 0);
  const neg = g < 0; g = Math.abs(g);
  const i = Math.floor(g / 1000), f = String(g % 1000).padStart(3, '0').replace(/0+$/, '');
  return (neg ? '−' : '') + C.grp(i) + (f ? ',' + f : '') + (satuan === false ? '' : ' kg');
};
C.fmtPersen = function (bp) { // basis points (1/100 %) → "2,35%"
  const neg = bp < 0; bp = Math.abs(Math.round(bp));
  const i = Math.floor(bp / 100), f = String(bp % 100).padStart(2, '0');
  return (neg ? '−' : '') + C.grp(i) + ',' + f + '%';
};

/* ---------------------------------------------------------------- dates */
const DAY = 86400000;
C.BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
C.BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
C.isISO = function (s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y, m, d] = s.split('-').map(Number);
  if (y < 1900 || y > 2200 || m < 1 || m > 12 || d < 1) return false;
  return d <= new Date(Date.UTC(y, m, 0)).getUTCDate();
};
C.d2n = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY; };
C.n2d = n => new Date(n * DAY).toISOString().slice(0, 10);
C.addDays = (s, k) => C.n2d(C.d2n(s) + k);
C.diffDays = (a, b) => C.d2n(b) - C.d2n(a);
C.maxD = (a, b) => (a > b ? a : b);
C.minD = (a, b) => (a < b ? a : b);
C.awalBulan = s => s.slice(0, 8) + '01';
C.akhirBulan = s => { const [y, m] = s.split('-').map(Number); return C.n2d(Date.UTC(y, m, 0) / DAY); };
C.addMonths = function (s, k) {
  let [y, m, d] = s.split('-').map(Number);
  m = m - 1 + k; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  const last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  return C.n2d(Date.UTC(y, m, Math.min(d, last)) / DAY);
};
C.fmtTgl = s => (C.isISO(s) ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '');
C.parseTgl = function (s) { // DD/MM/YYYY → ISO or null
  const m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/.exec(String(s || '').trim());
  if (!m) return null;
  const iso = m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  return C.isISO(iso) ? iso : null;
};
C.namaBulan = (ym, pendek) => (pendek ? C.BLN : C.BULAN)[Number(ym.slice(5, 7)) - 1] + ' ' + ym.slice(0, 4);
C.hariIni = function (now) {
  const d = now || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};
C.labelRentang = (a, b) => C.fmtTgl(a) + ' – ' + C.fmtTgl(b);
/* Split [from,to] into calendar-month segments; partial months are labelled. */
C.segmenBulan = function (from, to) {
  const out = [];
  let a = from;
  while (a <= to) {
    const eom = C.akhirBulan(a), b = eom < to ? eom : to;
    const ym = a.slice(0, 7), penuh = a === C.awalBulan(a) && b === eom;
    out.push({
      from: a, to: b, ym, penuh,
      label: C.namaBulan(ym) + (penuh ? '' : ' (' + a.slice(8) + '–' + b.slice(8) + ', sebagian)'),
      pendek: C.namaBulan(ym, true) + (penuh ? '' : ' ' + Number(a.slice(8)) + '–' + Number(b.slice(8))),
    });
    a = C.addDays(eom, 1);
  }
  return out;
};
C.preset = function (kode, today) {
  const t = today || C.hariIni();
  if (kode === 'hari') return { from: t, to: t, label: 'Hari ini, ' + C.fmtTgl(t) };
  if (kode === 'bulan') return { from: C.awalBulan(t), to: t, label: C.namaBulan(t.slice(0, 7)) + ' s.d. ' + C.fmtTgl(t) };
  if (kode === 'bulanlalu') {
    const a = C.awalBulan(C.addMonths(C.awalBulan(t), -1));
    return { from: a, to: C.akhirBulan(a), label: C.namaBulan(a.slice(0, 7)) };
  }
  if (kode === 'tahun') return { from: t.slice(0, 4) + '-01-01', to: t, label: 'Tahun ' + t.slice(0, 4) + ' s.d. ' + C.fmtTgl(t) };
  if (kode === 'semua') return { from: '1900-01-01', to: '2199-12-31', label: 'Semua tanggal' };
  return null;
};

/* ---------------------------------------------------------------- reference data */
C.METODE = ['Tunai', 'Transfer', 'Lainnya'];
C.KATEGORI_AWAL = [
  { id: 'sewa', nama: 'Sewa Kandang', perlakuan: 'beban' },
  { id: 'perlengkapan', nama: 'Perlengkapan Kandang', perlakuan: 'beban' },
  { id: 'peralatan', nama: 'Peralatan Kandang', perlakuan: 'beban' },
  { id: 'listrik', nama: 'Listrik Kandang', perlakuan: 'beban' },
  { id: 'solar', nama: 'Solar Genset', perlakuan: 'beban' },
  { id: 'makan', nama: 'Makan ABK', perlakuan: 'beban' },
  { id: 'gaji', nama: 'Gaji ABK', perlakuan: 'beban', sistem: 'gaji' },
  { id: 'kasbon', nama: 'Kasbon ABK', perlakuan: 'beban', sistem: 'kasbon' },
  { id: 'doc', nama: 'Pembelian DOC', perlakuan: 'beban', sistem: 'doc' },
  { id: 'pakan', nama: 'Pakan', perlakuan: 'beban' },
  { id: 'ovk', nama: 'Obat, Vitamin & Vaksin', perlakuan: 'beban' },
  { id: 'lain', nama: 'Lain-lain', perlakuan: 'beban' },
];
C.WAJIB = ['sewa', 'perlengkapan', 'peralatan', 'listrik', 'solar', 'makan', 'gaji'];
C.PERLAKUAN = {
  beban: 'Beban periode ini',
  dimuka: 'Dibayar di muka (dibebankan bertahap)',
  aset: 'Aset peralatan (disusutkan)',
  jaminan: 'Uang jaminan (bukan beban)',
};
C.PTKP = { 'TK/0': 54000000, 'TK/1': 58500000, 'TK/2': 63000000, 'TK/3': 67500000, 'K/0': 58500000, 'K/1': 63000000, 'K/2': 67500000, 'K/3': 72000000 };
C.PESAN_PAJAK_BELUM = 'Laba setelah pajak belum dapat dihitung. Lengkapi pengaturan pajak usaha terlebih dahulu.';
C.TAX_VERIFIED = '2026-10-12';

C.pengaturanAwal = function () {
  return {
    usaha: { nama: '', pemilik: '', alamat: '', npwp: '' },
    saldoAwal: { tgl: '', kas: 0 },
    kebijakan: { pendapatan: 'akrual', gaji: 'akrual' },
    pajak: {
      status: 'belum', bentuk: 'op', rezim: 'final', metodeOP: 'pembukuan', normaBP: 0,
      ptkp: 'TK/0', penghasilanLain: 0, fasilitas31E: true, tahunMulaiFinal: 0,
      labaSetelah: 'estimasi', koreksi: [], disetujui: '',
    },
    csvSep: ';',
    keamanan: { pin: null },
  };
};

/* ---------------------------------------------------------------- documents */
C.itemTotal = function (it) {
  if (it.basis === 'kg') return C.mulDiv(it.gram || 0, it.harga || 0, 1000);
  return (it.ekor || 0) * (it.harga || 0);
};
C.totalJual = d => C.sum((d.items || []).map(C.itemTotal));
C.ekorJual = d => C.sum((d.items || []).map(i => i.ekor || 0));
C.gramJual = d => C.sum((d.items || []).map(i => i.gram || 0));
C.dibayarJual = (d, sampai) => C.sum((d.bayar || []).filter(b => !sampai || b.tgl <= sampai).map(b => b.jumlah));
C.statusJual = function (d) {
  const t = C.totalJual(d), p = C.dibayarJual(d);
  if (p <= 0) return 'Belum Lunas';
  return p >= t ? 'Lunas' : 'Sebagian';
};
C.aktif = x => x && !x.dihapus;
C.JENIS = {
  jual: 'Penjualan panen', plain: 'Pendapatan lain', biaya: 'Pengeluaran', gaji: 'Gaji ABK (terutang)',
  bgaji: 'Pembayaran gaji', kasbon: 'Kasbon ABK', bkasbon: 'Pelunasan kasbon', kas: 'Kas lain-lain',
  pajak: 'Setoran pajak', batch: 'Batch DOC',
};
C.PREFIX = { jual: 'PJ', plain: 'PL', biaya: 'BY', gaji: 'GJ', bgaji: 'PG', kasbon: 'KB', bkasbon: 'LK', kas: 'KL', pajak: 'PP' };
C.JENIS_KAS = { modal: 'Setoran modal pemilik', prive: 'Pengambilan pribadi (prive)', jaminan_kembali: 'Pengembalian uang jaminan' };
C.nominalDok = function (d) {
  switch (d.t) {
    case 'jual': return C.totalJual(d);
    case 'biaya': return d.nominal;
    case 'gaji': return d.bruto;
    case 'bgaji': return (d.tunai || 0) + (d.potong || 0);
    default: return d.jumlah || 0;
  }
};

/* Amortisation for prepaid costs and equipment: straight line per day, cumulative rounding
 * so any split of periods adds up exactly to the whole. */
C.amortRentang = function (d) {
  const mulai = d.mulai && C.isISO(d.mulai) ? d.mulai : d.tgl;
  const akhir = C.addDays(C.addMonths(mulai, Math.max(1, d.manfaat || 1)), -1);
  return { mulai, akhir, hari: C.diffDays(mulai, akhir) + 1 };
};
C.amortKumulatif = function (d, x) {
  const r = C.amortRentang(d);
  if (x < r.mulai) return 0;
  if (x >= r.akhir) return d.nominal;
  return C.mulDiv(d.nominal, C.diffDays(r.mulai, x) + 1, r.hari);
};
C.amortPotong = (d, from, to) => C.amortKumulatif(d, to) - C.amortKumulatif(d, C.addDays(from, -1));

/* ---------------------------------------------------------------- journal
 * Line: { tgl, a: account, s: sub-ledger, v: amount (debit +, credit −), doc, t: doc type,
 *         b: batch id|null, kat: expense category|null, cf: cash-flow class|null, m: memo }
 * Accounts: KAS kas & bank · PIU piutang pembeli · KSB piutang kasbon (s=emp) · DMK dibayar di muka
 *  · JMN uang jaminan · AST aset peralatan · AKM akumulasi penyusutan · UGJ utang gaji (s=emp)
 *  · MDL modal · PRV prive · PJK pajak dibayar · PDP pendapatan panen · PDL pendapatan lain · BBN beban (kat) */
C.AKUN = {
  KAS: 'Kas & bank', PIU: 'Piutang pembeli', KSB: 'Piutang kasbon ABK', DMK: 'Biaya dibayar di muka',
  JMN: 'Uang jaminan', AST: 'Aset peralatan', AKM: 'Akumulasi penyusutan', UGJ: 'Utang gaji ABK',
  MDL: 'Modal pemilik', PRV: 'Prive (pengambilan pribadi)', PJK: 'PPh dibayar', PDP: 'Pendapatan panen',
  PDL: 'Pendapatan lain', BBN: 'Beban',
};
C.MIN_TGL = '1900-01-01';
C.MAX_TGL = '2199-12-31';

C.jurnal = function (S, from, to) {
  from = from || C.MIN_TGL; to = to || C.MAX_TGL;
  const kb = (S.settings && S.settings.kebijakan) || { pendapatan: 'akrual', gaji: 'akrual' };
  const L = [];
  const inR = t => t >= from && t <= to;
  const nm = id => ((S.employees || []).find(e => e.id === id) || { nama: '' }).nama;
  const add = (tgl, a, v, doc, t, ex) => {
    if (!v || !inR(tgl)) return;
    L.push(Object.assign({ tgl, a, s: '', v, doc, t, b: null, kat: null, cf: null, m: '' }, ex || {}));
  };
  // opening balances from settings
  const sa = S.settings && S.settings.saldoAwal;
  if (sa && C.isISO(sa.tgl) && sa.kas) {
    const t0 = C.addDays(sa.tgl, -1);
    add(t0, 'KAS', sa.kas, 'saldo-awal', 'awal', { cf: 'saldo_awal', m: 'Saldo awal kas & bank' });
    add(t0, 'MDL', -sa.kas, 'saldo-awal', 'awal', { m: 'Saldo awal kas & bank' });
  }
  for (const e of S.employees || []) {
    if (e.dihapus || !e.kasbonAwal || !C.isISO(e.kasbonAwalTgl)) continue;
    const t0 = C.addDays(e.kasbonAwalTgl, -1);
    add(t0, 'KSB', e.kasbonAwal, 'emp-' + e.id, 'awal', { s: e.id, m: 'Saldo awal kasbon ' + e.nama });
    add(t0, 'MDL', -e.kasbonAwal, 'emp-' + e.id, 'awal', { m: 'Saldo awal kasbon ' + e.nama });
  }
  for (const bt of S.batches || []) {
    if (bt.dihapus || bt.sumberDoc !== 'beli') continue;
    const v = (bt.jumlahDoc || 0) * (bt.hargaDoc || 0);
    const m = 'DOC ' + bt.jumlahDoc + ' ekor, batch ' + bt.no;
    add(bt.tglMasuk, 'BBN', v, bt.id, 'batch', { kat: 'doc', b: bt.id, m });
    add(bt.tglMasuk, 'KAS', -v, bt.id, 'batch', { cf: 'operasional', b: bt.id, m });
  }
  for (const d of S.docs || []) {
    if (d.dihapus) continue;
    const t = d.t, id = d.id;
    if (t === 'jual') {
      const tot = C.totalJual(d), m = 'Penjualan ' + (d.no || '') + ' – ' + (d.pembeli || '');
      if (kb.pendapatan === 'kas') {
        for (const p of d.bayar || []) {
          add(p.tgl, 'KAS', p.jumlah, id, t, { cf: 'penjualan', b: d.batchId || null, m });
          add(p.tgl, 'PDP', -p.jumlah, id, t, { b: d.batchId || null, m });
        }
      } else {
        add(d.tgl, 'PIU', tot, id, t, { b: d.batchId || null, m });
        add(d.tgl, 'PDP', -tot, id, t, { b: d.batchId || null, m });
        for (const p of d.bayar || []) {
          add(p.tgl, 'KAS', p.jumlah, id, t, { cf: 'penjualan', b: d.batchId || null, m: 'Penerimaan ' + (d.no || '') });
          add(p.tgl, 'PIU', -p.jumlah, id, t, { b: d.batchId || null, m: 'Penerimaan ' + (d.no || '') });
        }
      }
    } else if (t === 'plain') {
      add(d.tgl, 'KAS', d.jumlah, id, t, { cf: 'pendapatan_lain', b: d.batchId || null, m: d.ket });
      add(d.tgl, 'PDL', -d.jumlah, id, t, { b: d.batchId || null, m: d.ket });
    } else if (t === 'biaya') {
      const b = d.batchId || null, m = d.desk, p = d.perlakuan || 'beban';
      if (p === 'beban') {
        add(d.tgl, 'BBN', d.nominal, id, t, { kat: d.kat, b, m });
        add(d.tgl, 'KAS', -d.nominal, id, t, { cf: 'operasional', b, m });
      } else if (p === 'jaminan') {
        add(d.tgl, 'JMN', d.nominal, id, t, { m });
        add(d.tgl, 'KAS', -d.nominal, id, t, { cf: 'jaminan', m });
      } else {
        const aset = p === 'aset';
        add(d.tgl, aset ? 'AST' : 'DMK', d.nominal, id, t, { b, m });
        add(d.tgl, 'KAS', -d.nominal, id, t, { cf: aset ? 'aset' : 'operasional', b, m });
        const r = C.amortRentang(d);
        const a = C.maxD(from, r.mulai), z = C.minD(to, r.akhir);
        if (a <= z) {
          const v = C.amortPotong(d, a, z);
          const mm = (aset ? 'Penyusutan ' : 'Pembebanan ') + d.desk + ' ' + C.fmtTgl(a) + '–' + C.fmtTgl(z);
          if (v) {
            L.push({ tgl: z, a: 'BBN', s: '', v, doc: id, t, b, kat: d.kat, cf: null, m: mm, amort: true });
            L.push({ tgl: z, a: aset ? 'AKM' : 'DMK', s: '', v: -v, doc: id, t, b, kat: null, cf: null, m: mm, amort: true });
          }
        }
      }
    } else if (t === 'gaji') {
      if (kb.gaji !== 'kas') {
        const m = 'Gaji ' + nm(d.emp) + ' ' + C.fmtTgl(d.dari) + '–' + C.fmtTgl(d.sampai);
        add(d.tgl, 'BBN', d.bruto, id, t, { kat: 'gaji', s: d.emp, m });
        add(d.tgl, 'UGJ', -d.bruto, id, t, { s: d.emp, m });
      }
    } else if (t === 'bgaji') {
      const tot = (d.tunai || 0) + (d.potong || 0), m = 'Pembayaran gaji ' + nm(d.emp);
      if (kb.gaji === 'kas') add(d.tgl, 'BBN', tot, id, t, { kat: 'gaji', s: d.emp, m });
      else add(d.tgl, 'UGJ', tot, id, t, { s: d.emp, m });
      add(d.tgl, 'KAS', -(d.tunai || 0), id, t, { cf: 'gaji', s: d.emp, m });

C.laporan = function (S, from, to, opt) {
  opt = opt || {};
  const batch = opt.batchId || null;
  const W = C.jurnal(S, from, to);
  const sebelum = from > C.MIN_TGL ? C.jurnal(S, C.MIN_TGL, C.addDays(from, -1)) : [];
  const Wb = batch ? W.filter(l => l.b === batch) : W;

  const panen = 0 - C.saldo(Wb, 'PDP'), lain = 0 - C.saldo(Wb, 'PDL');
  const katIds = [];
  for (const id of C.WAJIB) katIds.push(id);
  for (const k of S.categories || []) if (!katIds.includes(k.id) && k.id !== 'kasbon') katIds.push(k.id);
  for (const l of Wb) if (l.a === 'BBN' && !katIds.includes(l.kat)) katIds.push(l.kat);
  const beban = [];
  for (const id of katIds) {
    const v = C.sum(Wb.filter(l => l.a === 'BBN' && l.kat === id).map(l => l.v));
    if (v !== 0 || C.WAJIB.includes(id)) beban.push({ kat: id, nama: C.namaKategori(S, id), jumlah: v, wajib: C.WAJIB.includes(id) });
  }
  const bebanTotal = C.sum(beban.map(b => b.jumlah));
  const gaji = C.sum(beban.filter(b => b.kat === 'gaji').map(b => b.jumlah));
  const R = {
    from, to, hari: C.diffDays(from, to) + 1, batchId: batch,
    pendapatan: { panen, lain, total: panen + lain },
    beban, bebanTotal, gaji, bebanOperasional: bebanTotal - gaji,
    laba: panen + lain - bebanTotal,
    W, Wb,
  };
  // cash flow (whole business only)
  const kasAwal = C.saldo(sebelum, 'KAS');
  const cf = {};
  for (const k of C.CF_MASUK.concat(C.CF_KELUAR)) cf[k] = 0;
  for (const l of W) if (l.a === 'KAS') cf[l.cf] = (cf[l.cf] || 0) + l.v;
  const masuk = C.sum(C.CF_MASUK.map(k => cf[k])), keluar = 0 - C.sum(C.CF_KELUAR.map(k => cf[k]));
  R.kas = { awal: kasAwal, cf, masuk, keluar, akhir: kasAwal + masuk - keluar, akhirLedger: kasAwal + C.saldo(W, 'KAS') };
  // employee cash advances
  R.kasbon = (S.employees || []).filter(e => !e.dihapus).map(e => {
    const awal = C.saldo(sebelum, 'KSB', e.id);
    const ln = W.filter(l => l.a === 'KSB' && l.s === e.id);
    const baru = C.sum(ln.filter(l => l.v > 0).map(l => l.v));
    const potong = 0 - C.sum(ln.filter(l => l.sub === 'potong').map(l => l.v));
    const langsung = 0 - C.sum(ln.filter(l => l.sub === 'langsung').map(l => l.v));
    return { emp: e.id, nama: e.nama, awal, baru, potong, langsung, akhir: awal + baru - potong - langsung };
  });
  // closing positions
  const semua = sebelum.concat(W);
  R.posisi = {
    kas: R.kas.akhir,
    piutangPembeli: C.saldo(semua, 'PIU'),
    piutangKasbon: C.saldo(semua, 'KSB'),
    utangGaji: 0 - C.saldo(semua, 'UGJ'),
    dimuka: C.saldo(semua, 'DMK'),
    asetBuku: C.saldo(semua, 'AST') + C.saldo(semua, 'AKM'),
    jaminan: C.saldo(semua, 'JMN'),
  };
  R.jumlahTransaksi = C.hitungTransaksi(S, from, to, batch);
  R.seimbang = C.sum(W.map(l => l.v)) === 0;
  R.pajak = batch ? { terhitung: false, perBatch: true, pesan: 'Pajak dihitung untuk usaha secara keseluruhan, bukan per batch.' } : C.hitungPajak(S, R);
  R.labaSetelah = R.pajak.terhitung ? R.laba - R.pajak.dipakai : null;
  return R;
};
C.hitungTransaksi = function (S, from, to, batch) {
  let n = 0;
  for (const d of S.docs || []) if (!d.dihapus && d.tgl >= from && d.tgl <= to && (!batch || d.batchId === batch)) n++;
  for (const b of S.batches || []) if (!b.dihapus && b.tglMasuk >= from && b.tglMasuk <= to && (!batch || b.id === batch)) n++;
  return n;
};
/* Lines behind a report figure, grouped by source document (drill-down). */
C.rincian = function (S, R, kunci) {
  let L;
  const src = kunci.kas ? R.W : R.Wb;
  if (kunci.akun === 'BBN') L = src.filter(l => l.a === 'BBN' && (!kunci.kat || l.kat === kunci.kat));
  else if (kunci.akun === 'KAS') L = src.filter(l => l.a === 'KAS' && (!kunci.cf || l.cf === kunci.cf));
  else if (kunci.akun === 'KSB') L = src.filter(l => l.a === 'KSB' && l.s === kunci.s && (!kunci.sub || l.sub === kunci.sub));
  else L = src.filter(l => l.a === kunci.akun);
  const tanda = kunci.akun === 'PDP' || kunci.akun === 'PDL' || (kunci.akun === 'KSB' && kunci.sub && kunci.sub !== 'baru') ? -1 : 1;
  const tandaKas = kunci.akun === 'KAS' && C.CF_KELUAR.includes(kunci.cf) ? -1 : 1;
  return L.map(l => ({ tgl: l.tgl, doc: l.doc, t: l.t, m: l.m, v: l.v * tanda * tandaKas, amort: !!l.amort }));
};
C.cekRekonsiliasi = function (gab, bulan) {
  const f = r => [r.pendapatan.panen, r.pendapatan.lain, r.bebanTotal, r.laba, r.kas.masuk, r.kas.keluar];
  const g = f(gab), s = bulan.map(f);
  const beda = [];
  const nama = ['Pendapatan panen', 'Pendapatan lain', 'Total beban', 'Laba sebelum pajak', 'Kas masuk', 'Kas keluar'];
  g.forEach((v, i) => { const t = C.sum(s.map(x => x[i])); if (t !== v) beda.push(nama[i] + ': bulanan ' + t + ' ≠ gabungan ' + v); });
  if (bulan.length && bulan[0].kas.awal !== gab.kas.awal) beda.push('Saldo kas awal tidak sama');
  if (bulan.length && bulan[bulan.length - 1].kas.akhir !== gab.kas.akhir) beda.push('Saldo kas akhir tidak sama');
  for (let i = 1; i < bulan.length; i++) if (bulan[i].kas.awal !== bulan[i - 1].kas.akhir) beda.push('Saldo kas tidak bersambung di ' + bulan[i].from);
  return { cocok: beda.length === 0, beda };
};
C.seriBulanan = function (S, to, n) {
  const out = [];
  let a = C.awalBulan(C.addMonths(C.awalBulan(to), -(n - 1)));
  for (let i = 0; i < n; i++) {
    const z = i === n - 1 ? to : C.akhirBulan(a);
    const r = C.laporan(S, a, z);
    out.push({ ym: a.slice(0, 7), label: C.BLN[Number(a.slice(5, 7)) - 1], tahun: a.slice(0, 4), pendapatan: r.pendapatan.total, beban: r.bebanTotal, laba: r.laba, sebagian: z !== C.akhirBulan(a) });
    a = C.addMonths(a, 1);
  }
  return out;
};

/* ---------------------------------------------------------------- tax */
C.pasal17 = function (pkp) { // annual PKP → PPh, UU PPh Ps. 17(1)(a) as amended by UU HPP
  const lap = [[60000000, 5], [250000000, 15], [500000000, 25], [5000000000, 30], [Infinity, 35]];
  let sisa = Math.max(0, pkp), bawah = 0, x = 0n;
  for (const [atas, tarif] of lap) {
    const lebar = atas === Infinity ? sisa : Math.min(sisa, atas - bawah);
    if (lebar <= 0) break;
    x += BigInt(lebar) * BigInt(tarif); sisa -= lebar; bawah = atas;
  }
  return C.mulDiv(Number(x), 1, 100);
};

/* Vector logo: rounded tile + rooster shapes, drawn in the logo's own 512-unit design space. */

MiniPDF.prototype.bytes = function () {
  const objs = [];

  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  objs[5] = '<< /Title (' + winAnsi(this.title).replace(/[\x80-\xff]/g, '-').replace(/[()\\]/g, '') + ') /Producer (Victory Chicken Farm) >>';
  const kids = [];
  let n = 6;
  for (const p of this.pages) {
    const content = p.join('\n');
    objs[n] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + this.W + ' ' + this.H + '] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ' + (n + 1) + ' 0 R >>';

/* ------------------------------------------------------------ report layout */
const INK = [24, 44, 78], ABU = [95, 102, 112], GARIS = [205, 210, 218], MERAH = [176, 32, 32], ISI = [238, 242, 248];
const angka = v => (v == null ? '–' : v < 0 ? '(' + C.grp(Math.abs(v)) + ')' : C.grp(v));

function Flow(pdf, pack) {
  this.pdf = pdf; this.pack = pack; this.m = 40; this.y = 0; this.bawah = pdf.H - 50;
  this.baru();
}
Flow.prototype.baru = function () {
  const p = this.pdf; p.page();
  this.y = this.m;
  if (p.pages.length > 1) {
    p.text(this.m, this.y + 8, (this.pack.usaha || 'Victory Chicken Farm') + ' · Laporan Keuangan ' + C.labelRentang(this.pack.from, this.pack.to), { size: 8, color: ABU });
    p.line(this.m, this.y + 14, p.W - this.m, this.y + 14, { color: GARIS });
    this.y += 26;
  }
};
Flow.prototype.perlu = function (h) { if (this.y + h > this.bawah) this.baru(); };
Flow.prototype.judul = function (t, sub) {
  this.perlu(48);
  this.y += 10;
  this.pdf.text(this.m, this.y + 11, t, { bold: true, size: 11.5, color: INK });
  this.y += 16;
  if (sub) for (const l of this.pdf.wrap(sub, this.pdf.W - 2 * this.m, false, 8)) { this.pdf.text(this.m, this.y + 8, l, { size: 8, color: ABU }); this.y += 11; }
  this.y += 3;
};
Flow.prototype.paragraf = function (t, o) {
  o = o || {};
  const size = o.size || 8.5, lebar = this.pdf.W - 2 * this.m - (o.indent || 0);
  for (const l of this.pdf.wrap(t, lebar, o.bold, size)) {
    this.perlu(size + 4);
    this.pdf.text(this.m + (o.indent || 0), this.y + size, l, { size, bold: o.bold, color: o.color || [40, 40, 40] });
    this.y += size + 3.5;
  }

/* cols: [{h}] value columns; rows: [{label, vals[], bold, garis, indent, teks}] */
Flow.prototype.tabel = function (cols, rows, opt) {
  opt = opt || {};
  const p = this.pdf, x0 = this.m, lebar = p.W - 2 * this.m;
  const maxKol = Math.max(1, Math.floor((lebar - 175) / 74));
  const potongan = [];
  for (let i = 0; i < cols.length; i += maxKol) potongan.push(i);
  for (const awal of potongan) {
    const cs = cols.slice(awal, awal + maxKol), idx = cs.map((_, k) => awal + k);
    const lebarNilai = cs.length === 1 ? 110 : 74, labelW = lebar - lebarNilai * cs.length;
    const kanan = k => x0 + labelW + lebarNilai * (k + 1) - 4;
    const head = () => {
      this.perlu(32);
      p.rect(x0, this.y, lebar, 16, { fill: ISI });
      p.text(x0 + 4, this.y + 11, opt.kepala || 'Uraian', { bold: true, size: 8, color: INK });
      cs.forEach((c, k) => p.text(kanan(k), this.y + 11, p.fit(c.h, lebarNilai - 6, true, 8), { bold: true, size: 8, align: 'right', color: INK }));
      p.line(x0 + 1, this.y, x0 + 1, this.y + 16, { color: MERAH, w: 0.8 });
      this.y += 18;
    };
    head();
    for (const r of rows) {
      if (this.y + 13 > this.bawah) { this.baru(); head(); }
      if (r.garis) p.line(x0, this.y - 1, x0 + lebar, this.y - 1, { color: [120, 126, 136], w: 0.6 });
      const ind = (r.indent || 0) * 10;
      p.text(x0 + 4 + ind, this.y + 9, p.fit(r.label, labelW - 8 - ind, r.bold, 8.5), { bold: r.bold, size: 8.5, color: r.warna || [30, 30, 30] });
      if (r.teks) p.text(kanan(cs.length - 1), this.y + 9, p.fit(r.teks, lebarNilai * cs.length - 8, false, 8), { size: 8, align: 'right', color: ABU });
      else idx.forEach((i, k) => {
        const v = r.vals ? r.vals[i] : null;
        if (v !== undefined) p.text(kanan(k), this.y + 9, typeof v === 'string' ? v : angka(v), { bold: r.bold, size: 8.5, align: 'right', color: v < 0 ? MERAH : [30, 30, 30] });
      });
      p.line(x0, this.y + 12.5, x0 + lebar, this.y + 12.5, { color: GARIS, w: 0.3 });
      this.y += 13;
    }
    this.y += 6;
  }
};

function laporanPdf(pack) {
  const S = pack.S, gab = pack.gab;
  const pdf = new MiniPDF({ title: 'Laporan Keuangan ' + C.labelRentang(pack.from, pack.to) });
  const F = new Flow(pdf, pack);
  const cols = pack.segmen.length > 1 ? pack.segmen.map(s => ({ h: s.pendek, r: s.rep })).concat([{ h: 'Gabungan', r: gab }]) : [{ h: 'Jumlah (Rp)', r: gab }];
  const v = fn => cols.map(c => fn(c.r));

  // cover block
  pdf.logo(F.m, F.y, 46);
  pdf.text(F.m + 58, F.y + 18, pack.usaha || 'Victory Chicken Farm', { bold: true, size: 15, color: INK });
  pdf.text(F.m + 58, F.y + 36, 'Laporan Keuangan', { bold: true, size: 12 });
  F.y += 56;
  const info = ['Periode: ' + C.labelRentang(pack.from, pack.to) + ' (' + gab.hari + ' hari)' + (pack.batchLabel ? ' · Batch: ' + pack.batchLabel : ''),
    'Basis: pendapatan ' + (S.settings.kebijakan.pendapatan === 'kas' ? 'diakui saat kas diterima' : 'akrual (diakui saat ayam diserahkan)') + '; gaji ' + (S.settings.kebijakan.gaji === 'kas' ? 'diakui saat dibayar' : 'akrual (diakui saat terutang)') + '. Angka dalam Rupiah; angka dalam kurung = negatif/keluar.',
    'Dibuat ' + pack.dibuat + ' dari ' + gab.jumlahTransaksi + ' transaksi tersimpan.'];
  for (const t of info) F.paragraf(t, { size: 8.5, color: ABU });
  const parsial = pack.segmen.filter(s => !s.penuh);
  if (parsial.length) F.paragraf('Bulan sebagian: ' + parsial.map(s => s.label).join('; ') + '. Angka bulan tersebut hanya sampai tanggal yang tertera, bukan satu bulan penuh.', { size: 8.5, color: MERAH });
  pdf.line(F.m, F.y + 4, pdf.W - F.m, F.y + 4, { color: INK, w: 1 });
  F.y += 8;

  F.judul('A. Laporan Pendapatan');
  F.tabel(cols, [
    { label: 'Pendapatan panen', vals: v(r => r.pendapatan.panen) },
    { label: 'Pendapatan lainnya', vals: v(r => r.pendapatan.lain) },
    { label: 'Total pendapatan', vals: v(r => r.pendapatan.total), bold: true, garis: true },
  ]);

  F.judul('B. Laporan Pengeluaran (beban per kategori)', 'Kasbon ABK bukan beban; kasbon tercatat sebagai piutang ABK (bagian D dan E). Pembelian peralatan dan biaya dibayar di muka dibebankan bertahap.');
  const kats = gab.beban.map(b => b.kat);
  for (const c of cols) for (const b of c.r.beban) if (!kats.includes(b.kat)) kats.push(b.kat);
  F.tabel(cols, kats.map(k => ({ label: C.namaKategori(S, k), vals: v(r => (r.beban.find(b => b.kat === k) || { jumlah: 0 }).jumlah) }))
    .concat([{ label: 'Total beban', vals: v(r => r.bebanTotal), bold: true, garis: true }]));

  F.judul('C. Laporan Laba Rugi');
  const rowsC = [
    { label: 'Total pendapatan', vals: v(r => r.pendapatan.total) },
    { label: 'Beban operasional (selain gaji)', vals: v(r => -r.bebanOperasional), indent: 1 },
    { label: 'Beban gaji ABK', vals: v(r => -r.gaji), indent: 1 },
    { label: 'Laba sebelum pajak', vals: v(r => r.laba), bold: true, garis: true },
  ];
  if (gab.pajak.terhitung) {
    rowsC.push({ label: 'Estimasi PPh (' + gab.pajak.rezim + ')', vals: v(r => (r.pajak.terhitung ? -r.pajak.estimasi : null)) });
    if (gab.pajak.aktual) rowsC.push({ label: 'PPh aktual tercatat (setoran)', vals: v(r => -(r.pajak.aktual || 0)) });
    rowsC.push({ label: 'Laba setelah pajak (memakai ' + (gab.pajak.sumberDipakai === 'aktual' ? 'PPh aktual' : 'estimasi') + ')', vals: v(r => r.labaSetelah), bold: true, garis: true });
  } else {
    rowsC.push({ label: 'Laba setelah pajak', teks: 'belum dapat dihitung', bold: true, garis: true });
  }
  F.tabel(cols, rowsC);
  if (!gab.pajak.terhitung) F.paragraf(gab.pajak.pesan, { color: MERAH });
  else if (cols.length > 1 && gab.pajak.rezim.indexOf('Final') < 0) F.paragraf('Catatan: dengan tarif umum, jumlah estimasi pajak bulanan tidak harus sama dengan estimasi gabungan karena tarif berlapis dan penyetahunan.', { color: ABU });

  F.judul('D. Laporan Arus Kas', 'Pendapatan, laba dan kas yang diterima tidak selalu sama: penjualan yang belum dibayar menjadi piutang, pembelian aset dan kasbon mengurangi kas tetapi bukan beban.');
  const rowsD = [{ label: 'Saldo kas awal', vals: v(r => r.kas.awal), bold: true }];
  for (const k of C.CF_MASUK) if (cols.some(c => c.r.kas.cf[k])) rowsD.push({ label: C.CF_LABEL[k], vals: v(r => r.kas.cf[k] || 0), indent: 1 });
  for (const k of C.CF_KELUAR) if (k === 'operasional' || k === 'gaji' || k === 'kasbon' || cols.some(c => c.r.kas.cf[k])) rowsD.push({ label: C.CF_LABEL[k], vals: v(r => r.kas.cf[k] || 0), indent: 1 });
  rowsD.push({ label: 'Kenaikan (penurunan) kas', vals: v(r => r.kas.masuk - r.kas.keluar), garis: true });
  rowsD.push({ label: 'Saldo kas akhir', vals: v(r => r.kas.akhir), bold: true, garis: true });
  F.tabel(cols, rowsD);

  F.judul('E. Laporan Kasbon ABK');
  const rowsE = [];
  for (const e of gab.kasbon) {
    const k = (r, f) => (r.kasbon.find(x => x.emp === e.emp) || {})[f] || 0;
    rowsE.push({ label: e.nama, bold: true, vals: cols.map(() => '') });
    rowsE.push({ label: 'Saldo awal kasbon', vals: v(r => k(r, 'awal')), indent: 1 });
    rowsE.push({ label: 'Kasbon baru', vals: v(r => k(r, 'baru')), indent: 1 });
    rowsE.push({ label: 'Dipotong dari gaji', vals: v(r => -k(r, 'potong')), indent: 1 });
    rowsE.push({ label: 'Pembayaran langsung', vals: v(r => -k(r, 'langsung')), indent: 1 });
    rowsE.push({ label: 'Saldo akhir kasbon', vals: v(r => k(r, 'akhir')), indent: 1, bold: true, garis: true });
  }
  if (rowsE.length) F.tabel(cols, rowsE); else F.paragraf('Belum ada data ABK.');

  F.judul('F. Posisi per ' + C.fmtTgl(pack.to));
  const ps = gab.posisi;
  F.tabel([{ h: 'Saldo (Rp)' }], [
    { label: 'Kas & bank', vals: [ps.kas] },
    { label: 'Piutang pembeli (penjualan belum dibayar)', vals: [ps.piutangPembeli] },
    { label: 'Piutang kasbon ABK', vals: [ps.piutangKasbon] },
    { label: 'Biaya dibayar di muka (belum dibebankan)', vals: [ps.dimuka] },
    { label: 'Nilai buku peralatan', vals: [ps.asetBuku] },
    { label: 'Uang jaminan', vals: [ps.jaminan] },
    { label: 'Utang gaji ABK (belum dibayar)', vals: [-ps.utangGaji] },
  ]);

  F.judul('G. Pajak');
  if (!gab.pajak.terhitung) F.paragraf(gab.pajak.perBatch ? gab.pajak.pesan : C.PESAN_PAJAK_BELUM);
  else {
    const P = gab.pajak;
    F.paragraf('Bentuk usaha: ' + C.BENTUK[P.bentuk] + ' · Rezim: ' + P.rezim, { bold: true });
    if (P.rincian.length && P.rincian[0].pajak !== undefined) F.tabel([{ h: 'Peredaran bruto' }, { h: 'Dasar pengenaan' }, { h: 'PPh final' }], P.rincian.map(x => ({ label: x.label, vals: [x.bruto, x.dasar, x.pajak] })).concat([{ label: 'Jumlah estimasi', vals: ['', '', P.estimasi], bold: true, garis: true }]), { kepala: 'Masa' });
    else F.tabel([{ h: 'Rp' }], P.rincian.map(x => ({ label: x.label, vals: [x.nilai] })).concat([{ label: 'Estimasi PPh periode', vals: [P.estimasi], bold: true, garis: true }]));
    for (const w of P.peringatan) F.paragraf('Perhatian: ' + w, { color: MERAH });
    for (const c of P.catatan) F.paragraf('• ' + c);
    F.paragraf('Dasar hukum (diperiksa ' + C.fmtTgl(C.TAX_VERIFIED) + '):', { bold: true });
    for (const d of P.dasar) F.paragraf('• ' + d, { indent: 6 });
  }

  F.judul('H. Pemeriksaan');
  F.paragraf((gab.seimbang ? 'Jurnal seimbang: total debit sama dengan total kredit.' : 'PERINGATAN: jurnal tidak seimbang.'));
  if (pack.segmen.length > 1) F.paragraf(pack.rekon.cocok ? 'Jumlah laporan bulanan sama dengan laporan gabungan (pendapatan, beban, laba, kas).' : 'Selisih rekonsiliasi: ' + pack.rekon.beda.join('; '), { color: pack.rekon.cocok ? [30, 30, 30] : MERAH });
  F.paragraf('Laporan dibuat dari transaksi tersimpan di perangkat. Transaksi yang dihapus tidak dihitung dan tetap tercatat di riwayat perubahan.');

  if (pack.daftar && pack.daftar.length) {
    F.judul('Lampiran: Daftar transaksi periode', 'Nilai transaksi sesuai dokumen sumber. Untuk jurnal debit/kredit lengkap gunakan ekspor CSV Jurnal.');
    const p = pdf, x0 = F.m, L = p.W - 2 * F.m;
    const xs = [x0 + 4, x0 + 60, x0 + 130, x0 + 230], kanan = x0 + L - 4;
    const head = () => {
      F.perlu(30);
      p.rect(x0, F.y, L, 15, { fill: ISI });
      ['Tanggal', 'Nomor', 'Jenis', 'Keterangan'].forEach((h, i) => p.text(xs[i], F.y + 10.5, h, { bold: true, size: 8, color: INK }));
      p.text(kanan, F.y + 10.5, 'Jumlah', { bold: true, size: 8, align: 'right', color: INK });
      F.y += 17;
    };
    head();

/* ---------------- storage (IndexedDB, all writes in one transaction) */
const STORES = ['docs', 'batches', 'employees', 'categories', 'kv', 'audit', 'files'];
const DB = {
  db: null, nama: 'victory-farm', mem: null,
  buka(nama) {
    this.nama = nama; this.db = null; this.mem = null;
    return new Promise(res => {
      let req;
      try { req = indexedDB.open(nama, 1); } catch (e) { this.mem = {}; return res(false); }
      req.onupgradeneeded = () => {
        const db = req.result;
        for (const s of STORES) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: s === 'kv' ? 'k' : 'id' });
      };
      req.onsuccess = () => { this.db = req.result; res(true); };
      req.onerror = () => { this.mem = {}; res(false); };
      req.onblocked = () => { this.mem = {}; res(false); };
    });
  },
  semua(store) {
    if (this.mem) return Promise.resolve(Object.values(this.mem[store] || {}).map(clone));
    return new Promise((res, rej) => {
      const r = this.db.transaction(store).objectStore(store).getAll();
      r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error);
    });
  },
  satu(store, key) {
    if (this.mem) return Promise.resolve((this.mem[store] || {})[key]);
    return new Promise((res, rej) => {
      const r = this.db.transaction(store).objectStore(store).get(key);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  tulis(ops) {
    if (this.mem) {
      for (const o of ops) {
        const m = this.mem[o.s] = this.mem[o.s] || {};
        if (o.clear) { this.mem[o.s] = {}; continue; }
        if (o.put) m[o.s === 'kv' ? o.put.k : o.put.id] = o.put.blob ? o.put : clone(o.put);
        if (o.del) delete m[o.del];
      }
      return Promise.resolve();
    }
    return new Promise((res, rej) => {
      const tx = this.db.transaction(Array.from(new Set(ops.map(o => o.s))), 'readwrite');
      for (const o of ops) {
        const st = tx.objectStore(o.s);
        if (o.clear) st.clear(); else if (o.put) st.put(o.put); else if (o.del) st.delete(o.del);
      }
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);

const audit = (aksi, jenis, ref, no, ringkas, sebelum, sesudah) => ({
  id: uid(), waktu: new Date().toISOString(), aksi, jenis, ref, no: no || '', ringkas: ringkas || '', sebelum: sebelum || null, sesudah: sesudah || null,
});
let persistDiminta = false;
async function mintaPersisten() {
  if (persistDiminta) return; persistDiminta = true;
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { /* not supported */ }
}
function upsert(arr, x) { const i = arr.findIndex(y => y.id === x.id); if (i >= 0) arr[i] = x; else arr.push(x); }
/* Save one or more documents atomically, assigning numbers to new ones. */
async function simpanDocs(list, aksiDefault, ringkas, ekstraOps) {
  const meta = clone(S.meta), ops = [], now = new Date().toISOString();
  const hasil = [];
  for (const it of list) {
    const d = clone(it.doc), lama = S.docs.find(x => x.id === d.id) || null;
    if (!d.no && C.PREFIX[d.t]) {
      const key = C.PREFIX[d.t] + '-' + d.tgl.slice(0, 4);
      meta.seq[key] = (meta.seq[key] || 0) + 1;
      d.no = key + '-' + String(meta.seq[key]).padStart(4, '0');
    }
    d.dibuat = d.dibuat || now; d.diubah = now;
    ops.push({ s: 'docs', put: d });
    ops.push({ s: 'audit', put: audit(it.aksi || aksiDefault || (lama ? 'ubah' : 'buat'), d.t, d.id, d.no, it.ringkas || ringkas || E.keterangan(S, d), lama, d) });
    hasil.push(d);
  }
  ops.push({ s: 'kv', put: { k: 'meta', v: meta } });
  await DB.tulis(ops.concat(ekstraOps || []));
  S.meta = meta;
  for (const d of hasil) upsert(S.docs, d);
  mintaPersisten();
  return hasil;
}
async function simpanEntitas(store, obj, jenis, ringkas, aksi) {
  const arr = store === 'batches' ? S.batches : store === 'employees' ? S.employees : S.categories;
  const lama = arr.find(x => x.id === obj.id) || null;
  const o = clone(obj); o.diubah = new Date().toISOString();
  await DB.tulis([{ s: store, put: o }, { s: 'audit', put: audit(aksi || (lama ? 'ubah' : 'buat'), jenis, o.id, o.no || o.nama || '', ringkas, lama, o) }]);
  upsert(arr, o);
  mintaPersisten();
  return o;
}
async function simpanPengaturan(baru, ringkas) {
  const lama = S.settings;

function seriChart(p) {
  const bulan = C.segmenBulan(p.from, p.to);
  const n = bulan.length >= 2 ? Math.min(12, bulan.length) : 6;
  return C.seriBulanan(S, p.to, n);
}
const tabelSeri = seri => '<details class="more"><summary>Lihat sebagai tabel</summary><div class="scrollx"><table class="mtable"><thead><tr><th>Bulan</th><th>Pendapatan</th><th>Beban</th><th>Laba</th></tr></thead><tbody>' +
  seri.map(s => '<tr><td>' + s.label + ' ' + s.tahun + (s.sebagian ? '*' : '') + '</td><td>' + C.fmtAngka(s.pendapatan) + '</td><td>' + C.fmtAngka(s.beban) + '</td><td class="' + (s.laba < 0 ? 'bad' : '') + '">' + C.fmtAngka(s.laba) + '</td></tr>').join('') +
  '</tbody></table></div><p class="small muted">* bulan berjalan, sampai tanggal akhir periode.</p></details>';
function skala(vals) {
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi === lo) hi = lo + 1000000;
  const kasar = (hi - lo) / 4, p10 = Math.pow(10, Math.floor(Math.log10(kasar)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p10).find(s => s >= kasar);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const ticks = []; for (let v = lo; v <= hi + step / 2; v += step) ticks.push(v);
  return { lo, hi, ticks };
}
function barPath(x, y0, w, y1, r) {
  const up = y1 < y0, hgt = Math.abs(y0 - y1);
  r = Math.min(r, w / 2, hgt);
  if (hgt < 0.5) return '';
  if (up) return 'M' + x + ',' + y0 + 'V' + (y1 + r) + 'Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y1 + ' ' + (x + w) + ',' + (y1 + r) + 'V' + y0 + 'Z';
  return 'M' + x + ',' + y0 + 'V' + (y1 - r) + 'Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y1 + ' ' + (x + w) + ',' + (y1 - r) + 'V' + y0 + 'Z';
}
function chartBar(seri) {
  const W = 340, H = 190, L = 46, R = 6, T = 10, B = 26;
  const sk = skala(seri.flatMap(s => [s.pendapatan, s.beban]));
  const y = v => T + (H - T - B) * (sk.hi - v) / (sk.hi - sk.lo);
  const bw = (W - L - R) / seri.length, w = Math.max(3, Math.min(16, bw * 0.32));
  let g = sk.ticks.map(t => '<line class="' + (t === 0 ? 'zero' : 'grid') + '" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '"/><text x="' + (L - 6) + '" y="' + (y(t) + 3.5) + '" text-anchor="end">' + singkat(t) + '</text>').join('');
  seri.forEach((s, i) => {
    const cx = L + bw * i + bw / 2;
    g += '<path class="in" d="' + barPath(cx - w - 1, y(0), w, y(s.pendapatan), 4) + '"/>';
    g += '<path class="out" d="' + barPath(cx + 1, y(0), w, y(s.beban), 4) + '"/>';
    g += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + s.label + '</text>';
    g += '<rect class="hit" data-i="' + i + '" x="' + (L + bw * i) + '" y="' + T + '" width="' + bw + '" height="' + (H - T - B + 4) + '"><title>' + s.label + ' ' + s.tahun + ': pendapatan ' + rp(s.pendapatan) + ', beban ' + rp(s.beban) + '</title></rect>';
  });
  return '<svg class="chart" id="chart1" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Grafik batang pendapatan dan beban per bulan">' + g + '</svg>';
}
function chartLine(seri) {
  const W = 340, H = 170, L = 46, R = 12, T = 14, B = 26;
  const sk = skala(seri.map(s => s.laba));
  const y = v => T + (H - T - B) * (sk.hi - v) / (sk.hi - sk.lo);
  const bw = (W - L - R) / seri.length, x = i => L + bw * i + bw / 2;
  let g = sk.ticks.map(t => '<line class="' + (t === 0 ? 'zero' : 'grid') + '" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '"/><text x="' + (L - 6) + '" y="' + (y(t) + 3.5) + '" text-anchor="end">' + singkat(t) + '</text>').join('');
  const pts = seri.map((s, i) => x(i) + ',' + y(s.laba));
  g += '<path class="area" d="M' + x(0) + ',' + y(0) + 'L' + pts.join('L') + 'L' + x(seri.length - 1) + ',' + y(0) + 'Z"/>';
  g += '<path class="pl" d="M' + pts.join('L') + '"/>';
  seri.forEach((s, i) => {
    g += '<circle class="pd" cx="' + x(i) + '" cy="' + y(s.laba) + '" r="4.5"/>';
    g += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + s.label + '</text>';
    g += '<rect class="hit" data-i="' + i + '" x="' + (L + bw * i) + '" y="' + T + '" width="' + bw + '" height="' + (H - T - B + 4) + '"><title>' + s.label + ' ' + s.tahun + ': laba ' + rp(s.laba) + '</title></rect>';
  });
  const last = seri[seri.length - 1];
  g += '<text x="' + x(seri.length - 1) + '" y="' + (y(last.laba) - 9) + '" text-anchor="end" style="font-weight:700;fill:var(--ink)">' + singkat(last.laba) + '</text>';
  return '<svg class="chart" id="chart2" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Grafik garis laba per bulan">' + g + '</svg>';
}

  h += docs.length ? '<div class="list">' + docs.slice(0, BATAS).map(d => {
    const amt = d.t === 'bgaji' ? rp(d.tunai) : rp(C.nominalDok(d));
    const s = d.t === 'gaji' ? 'Periode ' + tglF(d.dari) + '–' + tglF(d.sampai) + ((d.komponen || 'pokok') === 'tambahan' ? ' · tambahan' : '') : d.t === 'bgaji' ? (d.potong ? 'Bruto ' + rp(d.tunai + d.potong) + ' − kasbon ' + rp(d.potong) : 'Tanpa potongan') : esc(d.metode || '');

}

/* ---------------- Batch */
function vBatch() {

    const st = C.statBatch(S, b);
    return '<button class="item" data-act="detail-batch" data-id="' + b.id + '"><span class="t">' + esc(b.no) + ' ' + (b.status === 'selesai' ? '<span class="badge mute">Selesai</span>' : '<span class="badge ok">Berjalan</span>') + '</span><span class="a">' + C.fmtAngka(st.sisa) + ' ekor</span>' +
      '<span class="s">Masuk ' + tglF(b.tglMasuk) + ' · ' + C.fmtAngka(st.awal) + ' DOC · mortalitas ' + C.fmtPersen(st.mortalitasBP) + '</span><span class="r muted">' + rp(st.penjualan) + '</span></button>';
  }).join('') + '</div>';
  return h;
}

const kunciLap = () => { const L = UI.lap; return [L.from, L.to, L.bulanan, L.batch, S.docs.length, JSON.stringify(S.settings.kebijakan), JSON.stringify(S.settings.pajak)].join('|'); };
function hitungLaporan() {
  const L = UI.lap;
  const P = E.paket(S, L.from, L.to, { bulanan: L.bulanan, batchId: L.batch || null });
  LAP = { key: kunciLap(), P };
  if (!['gab'].concat(P.segmen.map(s => s.ym)).includes(L.seg)) L.seg = 'gab';
}
function hasilLaporan() {
  const P = LAP.P, L = UI.lap;
  const multi = P.segmen.length > 1;
  const r = L.seg === 'gab' || !multi ? P.gab : P.segmen.find(s => s.ym === L.seg).rep;
  const seg = multi && L.seg !== 'gab' ? P.segmen.find(s => s.ym === L.seg) : null;
  const n = v => '<td class="n' + (v < 0 ? ' neg' : '') + '">' + (v < 0 ? '−' : '') + C.grp(Math.abs(v)) + '</td>';
  const baris = (lbl, v, o) => {
    o = o || {};
    return '<tr class="' + (o.cls || '') + '"' + (o.dd ? ' data-act="drill" data-k=\'' + esc(JSON.stringify(o.dd)) + '\' data-l="' + esc(lbl) + '"' : '') + '><td>' + esc(lbl) + '</td>' + (o.teks ? '<td class="n muted">' + esc(o.teks) + '</td>' : n(v)) + '</tr>';
  };
  let h = '';
  if (multi) h += '<div class="segtabs" role="group" aria-label="Pilih bulan">' + ['gab'].concat(P.segmen.map(s => s.ym)).map((k, i) => '<button data-act="lap-seg" data-v="' + k + '" aria-pressed="' + (L.seg === k) + '">' + (k === 'gab' ? 'Gabungan' : esc(P.segmen[i - 1].pendek)) + '</button>').join('') + '</div>';
  h += '<div class="card stack"><div><div class="eyebrow">' + (seg ? esc(seg.label) : 'Periode ' + C.labelRentang(P.from, P.to)) + (P.batchLabel ? ' · batch ' + esc(P.batchLabel) : '') + '</div>' +
    (seg && !seg.penuh ? '<p class="small warn" style="margin:4px 0 0">Bulan sebagian: hanya ' + tglF(seg.from) + ' s.d. ' + tglF(seg.to) + ', bukan sebulan penuh.</p>' : '') +
    (!seg && P.segmen.some(s => !s.penuh) && multi ? '<p class="small muted" style="margin:4px 0 0">Termasuk bulan sebagian: ' + P.segmen.filter(s => !s.penuh).map(s => esc(s.label)).join(', ') + '.</p>' : '') + '</div>' +
    (multi ? '<div class="recon ' + (P.rekon.cocok ? 'good' : 'bad') + '">' + ic(P.rekon.cocok ? 'lap' : 'alert') + (P.rekon.cocok ? 'Jumlah laporan bulanan sama dengan gabungan.' : 'Selisih: ' + esc(P.rekon.beda.join('; '))) + '</div>' : '') + '</div>';

  h += '<section class="card"><h3>A. Laporan Pendapatan</h3><table class="ledger"><tbody>' +
    baris('Pendapatan panen', r.pendapatan.panen, { dd: { akun: 'PDP' } }) + baris('Pendapatan lainnya', r.pendapatan.lain, { dd: { akun: 'PDL' } }) +
    baris('Total pendapatan', r.pendapatan.total, { cls: 'tot' }) + '</tbody></table></section>';

  h += '<section class="card"><h3>B. Laporan Pengeluaran</h3><table class="ledger"><tbody>' +
    r.beban.map(b => baris(b.nama, b.jumlah, { dd: { akun: 'BBN', kat: b.kat } })).join('') + baris('Total beban', r.bebanTotal, { cls: 'tot' }) +
    '</tbody></table><p class="small muted">Kasbon ABK tidak termasuk beban. Kasbon dicatat sebagai piutang ABK (lihat Arus Kas dan Kasbon ABK). Ketuk baris untuk melihat transaksinya.</p></section>';

  const pj = r.pajak;
  h += '<section class="card"><h3>C. Laporan Laba Rugi</h3><table class="ledger"><tbody>' +
    baris('Total pendapatan', r.pendapatan.total) +
    baris('Beban operasional (selain gaji)', -r.bebanOperasional, { cls: 'sub' }) + baris('Beban gaji ABK', -r.gaji, { cls: 'sub', dd: { akun: 'BBN', kat: 'gaji' } }) +
    baris('Laba sebelum pajak', r.laba, { cls: 'tot' }) +
    (pj.terhitung ? baris('Estimasi PPh', -pj.estimasi, { cls: 'sub' }) + (pj.aktual ? baris('PPh aktual tercatat', -pj.aktual, { cls: 'sub' }) : '') + baris('Laba setelah pajak', r.labaSetelah, { cls: 'tot' })
      : baris('Laba setelah pajak', 0, { cls: 'tot', teks: 'belum dihitung' })) +
    '</tbody></table>';
  if (!pj.terhitung) h += '<div class="taxbox" style="margin-top:10px"><b>' + esc(pj.pesan) + '</b>' + (pj.perBatch ? '' : '<button class="btn" style="align-self:flex-start" data-act="buka-pajak">Atur pajak usaha</button>') + '</div>';
  else {
    h += '<div class="taxbox" style="margin-top:10px"><b>' + esc(pj.rezim) + ' · ' + esc(C.BENTUK[pj.bentuk]) + '</b>';
    if (pj.rincian.length && pj.rincian[0].pajak !== undefined) h += '<table class="ledger"><tbody>' + pj.rincian.map(x => '<tr class="sub"><td>' + esc(x.label) + '<br><span class="small muted">bruto ' + rp(x.bruto) + ', dasar ' + rp(x.dasar) + '</span></td>' + n(x.pajak) + '</tr>').join('') + '</tbody></table>';
    else h += '<table class="ledger"><tbody>' + pj.rincian.map(x => '<tr class="sub"><td>' + esc(x.label) + '</td>' + n(x.nilai) + '</tr>').join('') + '</tbody></table>';
    h += (pj.peringatan.length ? '<ul class="bad">' + pj.peringatan.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '') + '<ul>' + pj.catatan.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' +
      '<details><summary class="small">Dasar hukum (diperiksa ' + tglF(C.TAX_VERIFIED) + ')</summary><ul class="small">' + pj.dasar.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></details>' +
      '<p class="small muted" style="margin:0">Laba setelah pajak memakai ' + (pj.sumberDipakai === 'aktual' ? 'PPh aktual yang dicatat' : 'estimasi') + '; pajak tidak dikurangkan dua kali.</p></div>';
  }
  h += '</section>';

  if (!P.batchLabel) {
    const cf = r.kas.cf;
    h += '<section class="card"><h3>D. Laporan Arus Kas</h3><table class="ledger"><tbody>' + baris('Saldo kas awal', r.kas.awal, { cls: 'tot' });
    for (const k of C.CF_MASUK) if (cf[k] || k === 'penjualan') h += baris(C.CF_LABEL[k], cf[k] || 0, { cls: 'sub', dd: { akun: 'KAS', cf: k, kas: 1 } });
    for (const k of C.CF_KELUAR) if (cf[k] || ['operasional', 'gaji', 'kasbon'].includes(k)) h += baris(C.CF_LABEL[k], cf[k] || 0, { cls: 'sub', dd: { akun: 'KAS', cf: k, kas: 1 } });
    h += baris('Saldo kas akhir', r.kas.akhir, { cls: 'tot' }) + '</tbody></table><p class="small muted">Pendapatan, laba dan kas yang diterima tidak selalu sama. Penjualan yang belum dibayar menjadi piutang; kasbon dan pembelian peralatan mengurangi kas tetapi bukan beban pada saat itu.</p></section>';
    h += '<section class="card"><h3>E. Laporan Kasbon ABK</h3>' + (r.kasbon.length ? r.kasbon.map(k => '<table class="ledger" style="margin-bottom:8px"><tbody><tr class="head"><td>' + esc(k.nama) + '</td><td></td></tr>' +
      baris('Saldo awal kasbon', k.awal, { cls: 'sub' }) + baris('Kasbon baru', k.baru, { cls: 'sub', dd: { akun: 'KSB', s: k.emp, sub: 'baru', kas: 1 } }) +
      baris('Dipotong dari gaji', -k.potong, { cls: 'sub', dd: { akun: 'KSB', s: k.emp, sub: 'potong', kas: 1 } }) + baris('Pembayaran langsung', -k.langsung, { cls: 'sub', dd: { akun: 'KSB', s: k.emp, sub: 'langsung', kas: 1 } }) +
      baris('Saldo akhir kasbon', k.akhir, { cls: 'tot' }) + '</tbody></table>').join('') : '<p class="muted">Belum ada ABK.</p>') + '</section>';
    const ps = r.posisi;
    h += '<section class="card"><h3>Posisi per ' + tglF(r.to) + '</h3><table class="ledger"><tbody>' + baris('Kas & bank', ps.kas) + baris('Piutang pembeli', ps.piutangPembeli) + baris('Piutang kasbon ABK', ps.piutangKasbon) +
      (ps.dimuka ? baris('Biaya dibayar di muka', ps.dimuka) : '') + (ps.asetBuku ? baris('Nilai buku peralatan', ps.asetBuku) : '') + (ps.jaminan ? baris('Uang jaminan', ps.jaminan) : '') + baris('Utang gaji ABK', -ps.utangGaji) + '</tbody></table></section>';
  } else h += '<p class="small muted">Arus kas, kasbon dan pajak dihitung untuk usaha secara keseluruhan, sehingga tidak ditampilkan saat filter batch aktif. Biaya bersama (tanpa batch) juga tidak masuk; lihat detail batch untuk alokasinya.</p>';

  if (multi) {
    h += '<section class="card"><h3>Ringkasan per bulan</h3><div class="scrollx"><table class="mtable"><thead><tr><th>Bulan</th><th>Pendapatan</th><th>Beban</th><th>Laba</th></tr></thead><tbody>' +
      P.segmen.map(s => '<tr><td>' + esc(s.pendek) + '</td><td>' + C.fmtAngka(s.rep.pendapatan.total) + '</td><td>' + C.fmtAngka(s.rep.bebanTotal) + '</td><td class="' + (s.rep.laba < 0 ? 'bad' : '') + '">' + C.fmtAngka(s.rep.laba) + '</td></tr>').join('') +
      '<tr class="tot"><td>Gabungan</td><td>' + C.fmtAngka(P.gab.pendapatan.total) + '</td><td>' + C.fmtAngka(P.gab.bebanTotal) + '</td><td>' + C.fmtAngka(P.gab.laba) + '</td></tr></tbody></table></div></section>';
  }

    '<button class="btn primary" data-act="ekspor" data-v="pdf">' + ic('down') + 'PDF laporan keuangan</button>' +
    '<div class="grid2"><button class="btn" data-act="ekspor" data-v="labarugi">CSV laba rugi bulanan</button><button class="btn" data-act="ekspor" data-v="detail">CSV detail transaksi</button>' +
    '<button class="btn" data-act="ekspor" data-v="aruskas">CSV arus kas</button><button class="btn" data-act="ekspor" data-v="kasbon">CSV kasbon ABK</button>' +
    '<button class="btn" data-act="ekspor" data-v="jurnal">CSV jurnal (debit/kredit)</button></div></section>';
  h += '<p class="small muted">Kebijakan: pendapatan ' + (S.settings.kebijakan.pendapatan === 'kas' ? 'diakui saat uang diterima' : 'diakui saat ayam diserahkan (akrual)') + '; gaji ' + (S.settings.kebijakan.gaji === 'kas' ? 'diakui saat dibayar' : 'diakui saat terutang di akhir periode gaji (akrual)') + '. Jurnal ' + (r.seimbang ? 'seimbang.' : 'TIDAK seimbang.') + '</p>';
  return h;
}

/* ---------------- Pengeluaran */
async function olahFoto(file) {
  try {
    const bmp = await createImageBitmap(file);
    const sk = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * sk); cv.height = Math.round(bmp.height * sk);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.75));
    return { id: 'f' + uid(), blob, type: 'image/jpeg', nama: file.name || 'bukti.jpg', ukuran: blob.size };
  } catch (e) {
    if (file.size > 6e6) throw new Error('Foto terlalu besar dan tidak bisa diperkecil.');
    return { id: 'f' + uid(), blob: file, type: file.type || 'application/octet-stream', nama: file.name || 'bukti', ukuran: file.size };
  }
}
async function gambarThumb(canvas, blob) {
  try {
    const bmp = await createImageBitmap(blob);
    const s = 168, cv = canvas, ctx = cv.getContext('2d'); cv.width = s; cv.height = s;
    const k = Math.max(s / bmp.width, s / bmp.height), w = bmp.width * k, hh = bmp.height * k;
    ctx.drawImage(bmp, (s - w) / 2, (s - hh) / 2, w, hh);
  } catch (e) { const ctx = canvas.getContext('2d'); canvas.width = 168; canvas.height = 168; ctx.fillStyle = '#888'; ctx.font = '20px sans-serif'; ctx.fillText('Lampiran', 30, 90); }
}
async function lihatFoto(fileObj, onHapus) {
  const h = sheet({ judul: 'Bukti foto', isi: '<canvas id="big" style="width:100%;height:auto;border-radius:12px;background:var(--surface-2)"></canvas>', tanpaDirty: true,
    tombol: [{ label: 'Tutup' }].concat(onHapus ? [{ label: 'Hapus foto', cls: 'danger', async aksi(hh) { await onHapus(); hh.tutup(true); } }] : []) });
  try {
    const bmp = await createImageBitmap(fileObj.blob), cv = $('#big', h.form);
    cv.width = bmp.width; cv.height = bmp.height; cv.getContext('2d').drawImage(bmp, 0, 0);
  } catch (e) { $('#big', h.form).replaceWith(Object.assign(document.createElement('p'), { textContent: 'Lampiran tidak dapat ditampilkan di perangkat ini (' + fileObj.type + ').' })); }
}
