async function riwayat(refId) {
  let log = (await DB.semua('audit')).sort((a, b) => (a.waktu < b.waktu ? 1 : -1));
  if (refId) log = log.filter(a => a.ref === refId);
  const AKSI = { buat: 'Dibuat', ubah: 'Diubah', hapus: 'Dihapus', pulihkan: 'Dipulihkan', pengaturan: 'Pengaturan', impor: 'Pemulihan cadangan' };
  const fmtW = waktuLokal;
  const isi = (refId ? '' : '<p class="small muted" style="margin:0">Setiap penambahan, perubahan dan penghapusan tercatat di sini. Transaksi yang dihapus bisa dipulihkan dari daftar ini.</p>') +
    (log.length ? '<div class="list">' + log.slice(0, 300).map(a => '<button type="button" class="item" data-a="' + a.id + '"><span class="t">' + AKSI[a.aksi] + (a.no ? ' · ' + esc(a.no) : '') + '</span><span class="r muted">' + fmtW(a.waktu) + '</span><span class="s">' + esc(a.ringkas) + '</span><span></span></button>').join('') + '</div>' : '<p class="muted">Belum ada riwayat.</p>');
  sheet({
    judul: refId ? 'Riwayat transaksi' : 'Riwayat perubahan', isi, tanpaDirty: true,
    onOpen(h) {
      h.form.addEventListener('click', e => {
        const b = e.target.closest('[data-a]'); if (!b) return;
        const a = log.find(x => x.id === b.dataset.a);
        const doc = S.docs.find(x => x.id === a.ref);
        if (doc && !refId) return detailDoc(doc);
        const beda = a.sebelum && a.sesudah ? Object.keys(Object.assign({}, a.sebelum, a.sesudah)).filter(k => !['diubah', 'dibuat'].includes(k) && JSON.stringify(a.sebelum[k]) !== JSON.stringify(a.sesudah[k])) : [];
        const tampil = v => esc(typeof v === 'object' ? JSON.stringify(v) : v);
        sheet({ judul: AKSI[a.aksi] + ' ' + (a.no || ''), tanpaDirty: true, isi: '<p>' + esc(a.ringkas) + '</p><p class="small muted">' + fmtW(a.waktu) + '</p>' +
          (beda.length ? '<div class="scrollx"><table class="mtable"><thead><tr><th>Isian</th><th>Sebelum</th><th>Sesudah</th></tr></thead><tbody>' + beda.map(k => '<tr><td>' + esc(k) + '</td><td style="text-align:left;white-space:normal">' + tampil(a.sebelum[k]) + '</td><td style="text-align:left;white-space:normal">' + tampil(a.sesudah[k]) + '</td></tr>').join('') + '</tbody></table></div>' : ''), tombol: [{ label: 'Tutup' }] });
      });
    },
    tombol: [{ label: 'Tutup' }],
  });
}
function drill(kunci, label) {

  const rows = C.rincian(S, r, kunci);
  const tot = C.sum(rows.map(x => x.v));
  const docOf = id => S.docs.find(d => d.id === id);
  sheet({
    judul: label, tanpaDirty: true,
    isi: '<p class="small muted" style="margin:0">' + C.labelRentang(r.from, r.to) + ' · ' + rows.length + ' baris jurnal</p>' +
      (rows.length ? '<div class="list">' + rows.map(x => { const d = docOf(x.doc); return '<button type="button" class="item" data-doc="' + esc(x.doc) + '"><span class="t">' + esc(x.m || (d && E.keterangan(S, d)) || '') + '</span><span class="a' + (x.v < 0 ? ' bad' : '') + '">' + rp(x.v) + '</span><span class="s">' + tglF(x.tgl) + ' · ' + esc(d ? d.no : x.t === 'batch' ? 'Batch' : 'Saldo awal') + (x.amort ? ' · pembebanan bertahap' : '') + '</span><span></span></button>'; }).join('') + '</div>' : '<p class="muted">Tidak ada transaksi.</p>') +

function bagikanFile(blob, nama, teks) {

      '<button type="button" class="btn big' + (bisaShare ? '' : ' primary') + '" data-f="unduh">' + ic('down') + 'Unduh</button>') +
      (teks ? '<button type="button" class="btn" data-f="salin">' + ic('copy') + 'Salin isi CSV</button>' : '') + '</div>' +

        }

const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(s); };
const unb64 = s => { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
async function kunciDari(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function enkripsi(teks, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 210000;
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await kunciDari(pw, salt, iter), new TextEncoder().encode(teks));
  return { format: C.SKEMA, versi: 1, terenkripsi: true, kdf: { nama: 'PBKDF2-SHA256', iter, salt: b64(salt) }, sandi: 'AES-GCM-256', iv: b64(iv), data: b64(new Uint8Array(ct)) };
}
async function dekripsi(obj, pw) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(obj.iv) }, await kunciDari(pw, unb64(obj.kdf.salt), obj.kdf.iter), unb64(obj.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function isiCadangan() {
  const files = [];
  for (const f of await DB.semua('files')) files.push({ id: f.id, type: f.type, nama: f.nama, b64: b64(new Uint8Array(await f.blob.arrayBuffer())) });
  return { format: C.SKEMA, versi: 1, aplikasi: 'Victory Chicken Farm ' + C.VERSI, dibuat: new Date().toISOString(),
    data: { settings: S.settings, meta: S.meta, categories: S.categories, employees: S.employees, batches: S.batches, docs: S.docs, audit: await DB.semua('audit'), files } };
}

async function hashPin(pin, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  return b64(new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(salt), iterations: iter }, base, 256)));
}

      (ada ? F.teks('p-lama', 'PIN sekarang', '', { type: 'password' }) : '') + F.teks('p-baru', ada ? 'PIN baru (kosongkan untuk mematikan)' : 'PIN baru (4–8 angka)', '', { type: 'password' }) + F.teks('p-ulang', 'Ulangi PIN baru', '', { type: 'password' }),

}

/* ---------------- actions */
let cariT = null;
const ACT = {
  tab: el => { UI.tab = el.dataset.v; simpanUI(); render(); window.scrollTo(0, 0); },
  pengaturan: () => pengaturan(),
  fab: () => {
    if (UI.tab === 'panen') return bukaBaru(UI.panen.tab === 'plain' ? 'plain' : 'jual');
    if (UI.tab === 'biaya') return bukaBaru(UI.biaya.tab === 'kas' ? 'kas' : 'biaya');
    if (UI.tab === 'batch') return formBatch();
    if (UI.tab === 'abk') {
      return sheet({ judul: 'Catat untuk ABK', tanpaDirty: true, isi: '<div class="quick" style="grid-template-columns:repeat(2,1fr)">' + [['gaji', 'wallet', 'Proses gaji'], ['kasbon', 'hand', 'Kasbon'], ['bgaji', 'coin', 'Bayar gaji terutang'], ['bkasbon', 'hand', 'Pelunasan kasbon']].map(o => '<button type="button" class="qbtn" data-j="' + o[0] + '">' + ic(o[1]) + o[2] + '</button>').join('') + '</div>',
        onOpen(h) { h.form.addEventListener('click', async e => { const b = e.target.closest('[data-j]'); if (b) { await h.tutup(true); bukaBaru(b.dataset.j, UI.abk.emp || undefined); } }); } });
    }
    menuTambah();
  },
  periode: el => {
    const k = el.dataset.k; UI[k].kode = el.dataset.v;
    if (el.dataset.v === 'khusus' && !UI[k].from) { UI[k].from = C.awalBulan(today()); UI[k].to = today(); }
    simpanUI(); render();
  },
  'periode-khusus': el => {
    const k = el.dataset.k, a = $('#' + k + '-from').value, b = $('#' + k + '-to').value;
    if (!C.isISO(a) || !C.isISO(b) || a > b) return toast('Tanggal awal harus sebelum tanggal akhir.');
    Object.assign(UI[k], { from: a, to: b }); simpanUI(); render();
  },
  subtab: el => { UI[el.dataset.k].tab = el.dataset.v; simpanUI(); render(); },
  'status-jual': el => { UI.panen.status = el.dataset.v; simpanUI(); render(); },
  'abk-filter': el => { UI.abk.emp = el.dataset.v; render(); },
  baru: el => bukaBaru(el.dataset.v, el.dataset.emp),
  detail: el => detailDoc(S.docs.find(d => d.id === el.dataset.id)),
  'detail-batch': el => detailBatch(S.batches.find(b => b.id === el.dataset.id)),
  'edit-abk': el => formABK(S.employees.find(e => e.id === el.dataset.id)),
  'ke-laporan': el => { Object.assign(UI.lap, { from: el.dataset.from, to: el.dataset.to, bulanan: true, batch: '', seg: 'gab' }); hitungLaporan(); UI.tab = 'laporan'; simpanUI(); render(); window.scrollTo(0, 0); },
  'buka-pajak': () => formPajakSetting(),
  'lihat-piutang': () => { UI.tab = 'panen'; Object.assign(UI.panen, { tab: 'jual', kode: 'semua', status: 'piutang', q: '' }); render(); },
  'keluar-contoh': () => keluarContoh(),
  'tutup-pasang': () => { pref.tutupPasang = true; simpanPref(); render(); },
  'tutup-pratinjau': () => { pref.tutupPratinjau = true; simpanPref(); render(); },
  cadangan: () => menuCadangan(),
  'lap-preset': el => {
    const t = today(), v = el.dataset.v;
    const p = v === '2bulan' ? { from: C.awalBulan(C.addMonths(C.awalBulan(t), -1)), to: t } : C.preset(v);
    Object.assign(UI.lap, { from: p.from, to: p.to, seg: 'gab' }); hitungLaporan(); simpanUI(); render();
  },
  'lap-tampil': () => {
    const a = $('#lap-from').value, b = $('#lap-to').value;
    if (!C.isISO(a) || !C.isISO(b) || a > b) return toast('Tanggal awal harus sebelum atau sama dengan tanggal akhir.');
    Object.assign(UI.lap, { from: a, to: b, bulanan: $('#lap-bulanan').checked, batch: $('#lap-batch').value, seg: 'gab' });
    hitungLaporan(); simpanUI(); render();
    const hs = $('#lap-hasil'); if (hs) hs.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  'lap-seg': el => { UI.lap.seg = el.dataset.v; const y = window.scrollY; render(); window.scrollTo(0, y); },
  drill: el => drill(JSON.parse(el.dataset.k), el.dataset.l),
  ekspor: el => ekspor(el.dataset.v),
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => {
  const q = e.target.dataset && e.target.dataset.q;
  if (!q) return;
  UI[q].q = e.target.value;
  clearTimeout(cariT);
  cariT = setTimeout(() => { render(); const i = $('#q-' + q); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250);
});

/* ---------------- init */
async function init() {
  shell();
  await DB.buka(MODE === 'contoh' ? 'victory-farm-contoh' : 'victory-farm');
  await muatState();
  if (!S.settings) {
    if (MODE === 'contoh' || (window.BK_ARTIFACT && !lsGet('bk-pernah', false))) { lsSet('bk-pernah', true); await masukContoh(); }
    else { $('#main').innerHTML = '<div class="card flat empty">Menyiapkan Victory Chicken Farm…</div>'; mulaiPertama(); }
  } else render();
  kunci();
  if (window.BK_ARTIFACT && window.claude && window.claude.use) window.claude.use('downloads').then(x => { DL = x; }).catch(() => { DL = null; });
  if ('serviceWorker' in navigator && !window.BK_ARTIFACT && window.top === window && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline cache unavailable */ });
  }
}
init().catch(e => { console.error(e); $('#app').innerHTML = '<div class="card" style="margin:16px">Aplikasi gagal dimuat: ' + esc(e.message || e) + '</div>'; });

})();
</script>
</body>
</html>
